<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>html{color-scheme:light dark}</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23002060'/%3E%3Cpath d='M9 23 L16 8 L23 23' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
<title>Page not found · Breast Cancer Grant Runway</title>
<!-- Served by Cloudflare Pages for any path that matches no file. Without it, Pages falls back
     to index.html, whose relative app.js then resolves against the bogus path and the page hangs
     on "loading…". Self-contained, and every link is absolute so it works at any depth. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Tokens copied from index.html; keep the two in step. */
:root{
  --navy:#002060; --accent:#2B4A8A; --accent-soft:#5B7BC0;
  --ink:#141A26; --body:#1B1B2B; --muted:#5F6775; --faint:#646C7B;
  --ground:#FBFCFD; --panel:#FFFFFF; --line:#DCE2EC;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --navy:#8FAEE0; --accent:#7FA0D8; --accent-soft:#5B7BC0;
  --ink:#EEF2F8; --body:#DDE4EF; --muted:#9BA6B8; --faint:#8B95AB;
  --ground:#0C1220; --panel:#121A2B; --line:#26324B;
}}
:root[data-theme="dark"]{
  --navy:#8FAEE0; --accent:#7FA0D8; --accent-soft:#5B7BC0;
  --ink:#EEF2F8; --body:#DDE4EF; --muted:#9BA6B8; --faint:#8B95AB;
  --ground:#0C1220; --panel:#121A2B; --line:#26324B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
header.mast{border-bottom:1px solid var(--line);background:var(--panel);padding:26px 0 0}
.mast-in,.wrap{max-width:1500px;margin:0 auto;padding:0 24px}
.wrap{padding-top:22px;padding-bottom:72px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.04;
  margin:0 0 6px;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);font-size:14.5px;max-width:70ch;margin:0 0 20px}
a.home{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12.5px;
  color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft);padding-bottom:1px}
a.home:hover{color:var(--ink);border-color:var(--ink)}
a.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <p class="eyebrow">Baylor College of Medicine &middot; 404</p>
    <h1>Page <em>not found</em></h1>
    <p class="sub">Nothing lives at this address. The grant runway, its data, and the change log are all
      on the home page.</p>
  </div>
</header>

<main class="wrap">
  <a class="home" href="/">Go to the grant runway &rarr;</a>
</main>

</body>
</html>
